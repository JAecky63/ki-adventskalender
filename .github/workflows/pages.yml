name: Adventskalender automatisch veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:23 UTC ist im Dezember 00:23 Uhr in Deutschland (MEZ).
    # Das erste Türchen erscheint am 1. Dezember, das letzte am 24. Dezember.
    - cron: '23 23 30 11 *'
    - cron: '23 23 1-23 12 *'
    # Zusätzliche Läufe, falls GitHub eine nächtliche Ausführung verzögert.
    - cron: '37 6,18 1-24 12 *'

permissions:
  contents: read

# Bei dicht aufeinanderfolgenden geplanten Läufen nur den letzten deployen.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verschlüsselungsbibliothek installieren
        run: python -m pip install 'cryptography>=43,<48'
      - name: Freigeschaltete Türchen zusammenstellen
        env:
          ADVENT_KEY: ${{ secrets.ADVENT_KEY }}
        run: python build.py
      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5
      - name: Nur die veröffentlichungsfertige Website hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

